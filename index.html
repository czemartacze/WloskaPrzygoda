          const [authChecking, setAuthChecking] = useState(true);
          const [authError, setAuthError] = useState(null);

          const [currentTab, setCurrentTab] = useState('calendar'); 
          const [selectedDay, setSelectedDay] = useState(null);
          
          const today = new Date();

          const [showProfileModal, setShowProfileModal] = useState(false);
          const [newBadgeAlert, setNewBadgeAlert] = useState(null);
          const [showEpicWin, setShowEpicWin] = useState(false);

          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (err) {
                console.error("Auth Error:", err);
                setAuthError("Błąd łączenia z bazą danych (Code: " + err.code + "). Upewnij się, że autoryzowano domenę github.io w panelu Firebase (zakładka Authentication -> Settings -> Authorized domains).");
                setAuthChecking(false);
              }
            };
            initAuth();

            const unsubscribe = onAuthStateChanged(auth, (u) => { 
                if (u) {
                    setUser(u); 
                    setAuthChecking(false); 
                    setAuthError(null);
                }
            });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;
            const usersRef = collection(db, 'users');
            const unsubscribeUsers = onSnapshot(usersRef, (snapshot) => {
              const usersData = [];
              snapshot.forEach(doc => usersData.push({ id: doc.id, ...doc.data() }));
              setAllUsers(usersData);
              if (profile) {
                 setProfile(usersData.find(u => u.id === profile.id) || null);
              }
            }, (error) => {
               setAuthError("Brak dostępu do pobrania danych (Code: " + error.code + "). Upewnij się, że reguły bazy Firestore w trybie testowym nadal działają.");
            });
            
            const msgsRef = collection(db, 'messages');
            const unsubMsgs = onSnapshot(msgsRef, (snap) => {
               let myMsgs = 0;
               snap.forEach(doc => { if (profile && doc.data().authorId === profile.id) myMsgs++; });
               setMessagesCount(myMsgs);
            });

            return () => { unsubscribeUsers(); unsubMsgs(); }
          }, [user, profile?.id]);

          useEffect(() => {
            if (!profile) return;
            const evaluateBadges = () => {
               const earned = profile.badges || [];
               const newlyEarned = [];
               const completed = profile.completedDays?.length || 0;
               const challenges = profile.completedChallenges?.length || 0;
               
               let unlockedWordsCount = 0;
               (profile.completedDays || []).forEach(d => {
                  if (appData[d] && appData[d].words) unlockedWordsCount += appData[d].words.length;
               });

               const checkAndAward = (badgeId, condition) => {
                 if (condition && !earned.includes(badgeId) && !newlyEarned.includes(badgeId)) {
                   newlyEarned.push(badgeId);
                 }
               };

               checkAndAward('primo', completed >= 1);
               checkAndAward('studente', completed >= 10);
               checkAndAward('mezzo', completed >= 25);
               checkAndAward('esploratore', completed >= 40);
               checkAndAward('pronto', completed >= 49);
               checkAndAward('chiacchierone', messagesCount >= 5);
               checkAndAward('sfida', challenges >= 10);
               checkAndAward('maestro', unlockedWordsCount >= 20);

               if (newlyEarned.length > 0) {
                 const userRef = doc(db, 'users', profile.id);
                 setDoc(userRef, { badges: [...earned, ...newlyEarned] }, { merge: true });
                 setNewBadgeAlert(BADGES[newlyEarned[0]]);
               }
            };
            evaluateBadges();
          }, [profile, messagesCount]);

          const handleLoginSubmit = async (name) => {
            if (!user) return;
            const userKey = name.toLowerCase(); 
            const userRef = doc(db, 'users', userKey);
            
            await setDoc(userRef, { name: name, createdAt: serverTimestamp() }, { merge: true });
            
            const profileData = allUsers.find(u => u.id === userKey) || { id: userKey, name: name };
            setProfile(profileData);
          };

          const markDayCompleted = async (dayNum) => {
            if (!profile) return;
            if (profile.completedDays?.includes(dayNum)) { setSelectedDay(null); return; }
            const userRef = doc(db, 'users', profile.id);
            await setDoc(userRef, { completedDays: [...(profile.completedDays || []), dayNum] }, { merge: true });
            setSelectedDay(null);
          };

          const toggleChallenge = async (dayNum) => {
            if (!profile) return;
            const isDone = profile.completedChallenges?.includes(dayNum);
            const newChalls = isDone ? profile.completedChallenges.filter(d => d !== dayNum) : [...(profile.completedChallenges || []), dayNum];
            const userRef = doc(db, 'users', profile.id);
            await setDoc(userRef, { completedChallenges: newChalls }, { merge: true });
          };

          if (authError) {
             return (
               <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 text-white text-center">
                 <div className="bg-slate-800 p-8 rounded-xl border-l-4 border-red-500 max-w-lg w-full shadow-2xl">
                    <h2 className="text-xl font-bold mb-4 text-[#CD212A]">Blokada Bezpieczeństwa (Firebase)</h2>
                    <p className="text-sm mb-4 leading-relaxed">{authError}</p>
                 </div>
               </div>
             )
          }

          if (authChecking) {
             return (
                 <div className="min-h-screen flex flex-col items-center justify-center bg-[#F4F9FF]">
                     <div className="animate-spin text-[#008C45] mb-4"><CheckCircle size={48} /></div>
                     <p className="font-bold text-[#008C45] animate-pulse">Łączenie z serwerem...</p>
                 </div>
             )
          }
          
          if (user && !profile) return <LoginScreen onSubmit={handleLoginSubmit} />;

          return (
            <div className="min-h-screen bg-[#F4F9FF] font-sans text-slate-800 flex flex-col relative">
              <header className="bg-[#008C45] border-b-[6px] border-[#CD212A] p-4 shadow-xl text-white sticky top-0 z-20">
                <div className="max-w-4xl mx-auto flex justify-between items-center relative z-10">
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-serif font-bold tracking-wide drop-shadow-md">Włoska Wyprawa!</h1>
                    <p className="text-[#FFF5AD] text-xs sm:text-sm mt-0.5 italic tracking-wide">Ciao, {profile?.name}! Cel: Północne Włochy!</p>
                  </div>
                  
                  <div className="flex items-center gap-2 sm:gap-4">
                     <button onClick={() => setShowProfileModal(true)} className="flex items-center justify-center w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full border border-white/30 transition-all active:scale-95 shadow-inner relative group">
                        <User size={20} className="text-white" />
                        {(profile?.badges?.length || 0) > 0 && (
                          <span className="absolute -top-1 -right-1 bg-[#FBC02D] text-slate-900 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-white">
                            {profile.badges.length}
                          </span>
                        )}
                     </button>
                  </div>
                </div>
              </header>

              <main className="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-6 pb-28 relative z-10">
                {selectedDay ? (
                  <DayDispatcher 
                    dayNumber={selectedDay} dateObj={allDaysObj[selectedDay - 1]} data={appData[selectedDay]} 
                    onBack={() => setSelectedDay(null)} onComplete={() => markDayCompleted(selectedDay)}
                    isDayCompleted={profile?.completedDays?.includes(selectedDay)}
                    isChallengeCompleted={profile?.completedChallenges?.includes(selectedDay)}
                    onToggleChallenge={() => toggleChallenge(selectedDay)}
                  />
                ) : (
                  <>
                    {currentTab === 'calendar' && <CalendarView today={today} profile={profile} openDay={setSelectedDay} onEpicWin={() => setShowEpicWin(true)} />}
                    {currentTab === 'dictionary' && <DictionaryView profile={profile} />}
                    {currentTab === 'trivia' && <TriviaView profile={profile} />}
                    {currentTab === 'challenges' && <ChallengesView profile={profile} onToggle={toggleChallenge} />}
                    {currentTab === 'team' && <TeamView allUsers={allUsers} user={user} profile={profile} />}
                    {currentTab === 'chat' && <ChatView profile={profile} allUsers={allUsers} user={user} today={today} />}
                  </>
                )}
              </main>

              {!selectedDay && (
                <nav className="fixed bottom-0 w-full bg-white border-t border-slate-200 px-1 sm:px-4 py-2 pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] overflow-x-auto hide-scrollbar">
                  <div className="max-w-xl mx-auto flex justify-between items-center text-[9px] sm:text-xs font-bold text-slate-500 min-w-max px-2 gap-4 sm:gap-6">
                    <NavItem icon={<CalendarDays size={20} />} label="Plan" isActive={currentTab === 'calendar'} onClick={() => setCurrentTab('calendar')} />
                    <NavItem icon={<BookOpen size={20} />} label="Rozmówki" isActive={currentTab === 'dictionary'} onClick={() => setCurrentTab('dictionary')} />
                    <NavItem icon={<BrainCircuit size={20} />} label="Ciekawostki" isActive={currentTab === 'trivia'} onClick={() => setCurrentTab('trivia')} />
                    <NavItem icon={<CheckSquare size={20} />} label="Wyzwania" isActive={currentTab === 'challenges'} onClick={() => setCurrentTab('challenges')} />
                    <NavItem icon={<Users size={20} />} label="Zespół" isActive={currentTab === 'team'} onClick={() => setCurrentTab('team')} />
                    <NavItem icon={<MessageSquare size={20} />} label="Czat" isActive={currentTab === 'chat'} onClick={() => setCurrentTab('chat')} />
                  </div>
                </nav>
              )}

              {showProfileModal && <ProfileModal profile={profile} onClose={() => setShowProfileModal(false)} />}
              {newBadgeAlert && <BadgeAlertModal badge={newBadgeAlert} onClose={() => setNewBadgeAlert(null)} />}
              {showEpicWin && <EpicWinModal onClose={() => setShowEpicWin(false)} />}
            </div>
          );
        }

        function NavItem({ icon, label, isActive, onClick }) {
          return (
            <button onClick={onClick} className={`flex flex-col items-center p-2 rounded-xl transition-all duration-300 w-16 ${isActive ? 'text-[#CD212A]' : 'hover:bg-red-50 hover:text-[#CD212A]'}`}>
              <div className={`mb-1 transition-transform ${isActive ? 'scale-110 text-[#008C45] drop-shadow-sm' : ''}`}>{icon}</div>
              <span className={isActive ? 'text-[#008C45]' : ''}>{label}</span>
            </button>
          );
        }

        function LoginScreen({ onSubmit }) {
          const [name, setName] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            const inputName = name.trim();
            if (inputName.length < 2) { setError('Wpisz swoje imię!'); return; }
            const matchedName = Object.keys(USERS_CREDENTIALS).find(key => key.toLowerCase() === inputName.toLowerCase());
            if (!matchedName) { setError('Nie znaleziono takiego imienia na liście wyjazdowej.'); return; }
            if (USERS_CREDENTIALS[matchedName] !== password) { setError('Niepoprawne hasło.'); return; }
            onSubmit(matchedName);
          };

          return (
            <div className="min-h-screen flex items-center justify-center bg-[#F4F9FF] p-4 relative overflow-hidden">
              <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md animate-in zoom-in-95 border-t-8 border-t-[#008C45] border-b-8 border-b-[#CD212A] z-10 relative">
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-serif font-bold text-[#008C45] mb-2">Benvenuto!</h1>
                  <p className="text-slate-500 italic">Przygotujmy się na naszą Włoską Wyprawę!</p>
                </div>
                {error && <div className="bg-[#FFF5AD] text-[#CD212A] p-3 rounded-xl mb-4 text-sm font-semibold border border-[#FBC02D]">{error}</div>}
                <form onSubmit={handleSubmit} className="space-y-5">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">Twoje Imię</label>
                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full border-2 border-slate-200 bg-slate-50 p-3 rounded-xl focus:border-[#008C45] outline-none transition-colors" placeholder="Np. Anna" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">Hasło</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border-2 border-slate-200 bg-slate-50 p-3 rounded-xl focus:border-[#008C45] outline-none transition-colors" placeholder="Twoje indywidualne hasło" />
                  </div>
                  <button type="submit" className="w-full bg-[#CD212A] text-white font-bold py-4 rounded-xl mt-4 hover:bg-red-700 shadow-lg text-lg uppercase tracking-wider transition-all hover:scale-[1.02] active:scale-[0.98]">Andiamo!</button>
                </form>
              </div>
            </div>
          );
        }

        function BadgeAlertModal({ badge, onClose }) {
          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300">
               <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl animate-in zoom-in-95 border-4 border-[#FBC02D] relative overflow-hidden">
                  <h2 className="text-xl font-bold text-slate-500 uppercase tracking-widest mb-4">Nowa Odznaka!</h2>
                  <div className="text-7xl mb-4 drop-shadow-md">{badge.icon}</div>
                  <h3 className="text-2xl font-serif font-bold text-[#008C45] mb-2">{badge.name}</h3>
                  <p className="text-slate-600 font-medium mb-8">{badge.desc}</p>
                  <button onClick={onClose} className="bg-[#FBC02D] text-slate-900 font-bold py-3 px-8 rounded-full shadow-md hover:scale-105 active:scale-95 transition-all">
                    Fantastico!
                  </button>
               </div>
            </div>
          )
        }

        function EpicWinModal({ onClose }) {
          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300">
               <div className="bg-white p-8 rounded-3xl max-w-md w-full text-center shadow-2xl animate-in zoom-in-95 border-4 border-[#008C45] relative overflow-hidden">
                  <div className="text-7xl mb-4 drop-shadow-md animate-bounce">✈️</div>
                  <h3 className="text-4xl font-serif font-bold text-[#008C45] mb-2">Bravissimo!</h3>
                  <p className="text-slate-600 font-medium text-lg mb-6">Ukończyłeś wszystkie przygotowania i zadania w aplikacji.</p>
                  <div className="bg-[#F4F9FF] p-4 rounded-xl border border-[#55B9DD] mb-8 inline-block">
                    <p className="text-xl font-bold italic text-[#008C45]">Pakuj walizki. Włochy czekają!</p>
                  </div>
                  <button onClick={onClose} className="bg-slate-800 text-white font-bold py-3 px-8 rounded-full shadow-md hover:scale-105 active:scale-95 transition-all w-full">
                    Zamknij okno
                  </button>
               </div>
            </div>
          )
        }

        function ProfileModal({ profile, onClose }) {
          const myBadges = profile?.badges || [];
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in">
               <div className="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl animate-in zoom-in-95 flex flex-col max-h-[85vh]">
                  <div className="bg-[#008C45] p-6 text-white text-center relative border-b-4 border-[#CD212A] shrink-0">
                     <button onClick={onClose} className="absolute top-4 right-4 bg-white/20 w-8 h-8 rounded-full flex items-center justify-center font-bold hover:bg-white/40">X</button>
                     <div className="w-16 h-16 bg-white text-[#008C45] rounded-full mx-auto flex items-center justify-center text-2xl font-bold mb-3 shadow-md border-4 border-green-700">
                       {profile?.name?.substring(0, 2).toUpperCase()}
                     </div>
                     <h2 className="text-2xl font-serif font-bold">{profile?.name}</h2>
                     <p className="text-[#FFF5AD] text-sm">Twój profil i osiągnięcia</p>
                  </div>
                  <div className="p-6 overflow-y-auto bg-[#F4F9FF] flex-1">
                     <h3 className="font-bold text-slate-400 uppercase tracking-widest text-xs mb-4 text-center">Il Medagliere (Gablota Odznak)</h3>
                     <div className="grid grid-cols-2 gap-4">
                        {Object.values(BADGES).map(b => {
                           const isEarned = myBadges.includes(b.id);
                           return (
                             <div key={b.id} className={`p-4 rounded-2xl flex flex-col items-center text-center border-2 transition-all ${isEarned ? 'bg-white border-[#FBC02D] shadow-md' : 'bg-slate-100 border-slate-200 opacity-60 grayscale'}`}>
                                <div className="text-4xl mb-2 drop-shadow-sm">{b.icon}</div>
                                <h4 className={`font-serif font-bold text-sm mb-1 ${isEarned ? 'text-slate-800' : 'text-slate-500'}`}>{b.name}</h4>
                                <p className="text-[10px] text-slate-500 leading-tight">{b.desc}</p>
                             </div>
                           )
                        })}
                     </div>
                  </div>
               </div>
            </div>
          )
        }

        function CalendarView({ today, profile, openDay, onEpicWin }) {
          const completedCount = profile?.completedDays?.length || 0;
          const isAllCompleted = completedCount === 49;

          const isUnlocked = (dateObj) => {
            const checkDate = new Date(dateObj); checkDate.setHours(0,0,0,0);
            const todayDate = new Date(today); todayDate.setHours(0,0,0,0);
            return checkDate <= todayDate;
          };

          return (
            <div className="animate-in fade-in duration-500">
              <div className="mb-6 bg-white p-5 rounded-2xl shadow-sm border-l-4 border-l-[#008C45] flex gap-4 items-start">
                <div className="bg-[#F4F9FF] p-3 rounded-full text-[#008C45] shrink-0 border border-[#55B9DD]">
                  <Plane size={24} />
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-serif font-bold mb-1 text-[#008C45]">Plan Podróży</h2>
                  <p className="text-sm text-slate-600">Przygotujmy się na wyjazd do Włoch, wspólnie rozwiązując codzienne zadania!</p>
                </div>
              </div>

              <div className="bg-white p-3 sm:p-5 rounded-3xl shadow-sm border border-slate-200 relative overflow-hidden">
                <div className="grid grid-cols-7 gap-1.5 sm:gap-3 mb-2 text-center text-[9px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest">
                    <div>Pn</div><div>Wt</div><div>Śr</div><div>Cz</div><div>Pt</div><div className="text-[#55B9DD]">Sb</div><div className="text-[#55B9DD]">Nd</div>
                </div>

                <div className="grid grid-cols-7 gap-1.5 sm:gap-3 relative z-10">
                    {allDaysObj.map((dateObj, idx) => {
                      const dayNum = idx + 1;
                      const unlocked = isUnlocked(dateObj);
                      const isCompleted = profile?.completedDays?.includes(dayNum);
                      const data = appData[dayNum];
                      
                      const isWknd = data?.type === 'weekend';
                      const isSim = data?.type === 'simulation';
                      const isGame = data?.type.includes('minigame');
                      const isVideo = data?.type === 'video';

                      let btnClass = "relative aspect-[4/5] rounded-xl flex flex-col items-center p-1 transition-all shadow-sm border-2 font-serif group justify-between ";
                      
                      if (!unlocked) { btnClass += "bg-slate-50 border-slate-100 text-slate-300 cursor-not-allowed"; } 
                      else if (isCompleted) { btnClass += "bg-[#F4F9FF] border-[#008C45] text-[#008C45] hover:bg-green-50 cursor-pointer"; } 
                      else if (isWknd || isSim) { btnClass += "bg-[#F4F9FF] border-[#55B9DD] text-[#55B9DD] hover:bg-blue-50 hover:-translate-y-1 cursor-pointer"; } 
                      else if (isGame) { btnClass += "bg-[#FFF5AD] border-[#FBC02D] text-yellow-800 hover:bg-yellow-100 hover:-translate-y-1 cursor-pointer"; } 
                      else if (isVideo) { btnClass += "bg-red-50 border-[#CD212A] text-[#CD212A] hover:bg-red-100 hover:-translate-y-1 cursor-pointer"; } 
                      else { btnClass += "bg-white border-yellow-200 text-slate-700 hover:border-yellow-400 hover:-translate-y-1 cursor-pointer"; }

                      return (
                          <button key={dayNum} disabled={!unlocked} onClick={() => openDay(dayNum)} className={btnClass}>
                            <span className={`text-lg sm:text-2xl font-black mt-1 ${!unlocked ? 'opacity-50' : ''}`}>{dayNum}</span>
                            
                            <div className="h-4 flex items-center justify-center w-full">
                              {!unlocked && <Lock className="w-3 h-3 text-slate-300" />}
                              {unlocked && isGame && !isCompleted && <Award className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#FBC02D]" />}
                              {unlocked && isWknd && !isCompleted && <Coffee className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#55B9DD]" />}
                              {unlocked && isSim && !isCompleted && <MessageCircle className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#55B9DD]" />}
                              {unlocked && isVideo && !isCompleted && <Video className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#CD212A]" />}
                              {isCompleted && <CheckCircle className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#008C45]" />}
                            </div>

                            <span className={`text-[8px] sm:text-[10px] font-sans pb-0.5 tracking-tight ${unlocked && !isCompleted && (isWknd || isSim) ? 'text-[#55B9DD] font-bold' : 'text-slate-400 opacity-70'}`}>
                              {formatDate(dateObj)}
                            </span>
                          </button>
                      );
                    })}
                </div>
              </div>

              <div className="mt-8 mb-8">
                {isAllCompleted ? (
                   <button onClick={onEpicWin} className="w-full bg-[#FBC02D] text-slate-900 p-6 rounded-3xl shadow-xl border-4 border-white text-center animate-pulse hover:scale-[1.02] active:scale-95 transition-all">
                     <h3 className="text-2xl font-bold mb-1">Świętuj sukces! 🥂</h3>
                     <p className="font-medium opacity-80">Kliknij, by odebrać gratulacje.</p>
                   </button>
                ) : (
                  <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                    <div className="bg-[#FFF5AD] p-3 rounded-full shrink-0"><Medal className="w-6 h-6 text-yellow-600" /></div>
                    <div className="w-full">
                      <div className="flex justify-between mb-1 text-sm font-bold">
                         <span className="text-slate-600">Wielki Finał</span>
                         <span className="text-yellow-600">{completedCount} / 49</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200">
                         <div className="bg-[#008C45] h-full transition-all duration-1000" style={{width: `${(completedCount / 49) * 100}%`}}></div>
                      </div>
                      <p className="text-[10px] sm:text-xs text-slate-400 mt-1.5 font-medium">Ukończ wszystkie dni, by z dumą zamknąć przygotowania!</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        function DayDispatcher(props) {
          const { data, onBack } = props;
          if (!data) return <div className="text-center py-20 bg-white rounded-3xl"><button onClick={onBack} className="bg-slate-200 px-6 py-3 rounded-xl font-bold">Wróć</button></div>;

          const isGame = data.type.includes('minigame');
          const isSim = data.type === 'simulation';
          const isVid = data.type === 'video';
          const isWknd = data.type === 'weekend';

          let theme = 'bg-[#008C45]';
          let Icon = MapPin;
          
          if (isGame) { theme = 'bg-[#FBC02D] text-slate-900'; Icon = Award; }
          else if (isSim) { theme = 'bg-[#55B9DD]'; Icon = MessageCircle; }
          else if (isWknd) { theme = 'bg-[#55B9DD]'; Icon = Coffee; }
          else if (isVid) { theme = 'bg-[#CD212A]'; Icon = Video; }

          return (
            <div className="animate-in slide-in-from-right-8 duration-300 pb-10">
              <button onClick={props.onBack} className="flex items-center text-[#CD212A] font-bold mb-4 hover:bg-red-50 px-4 py-2 rounded-full transition-colors bg-white border border-red-100 shadow-sm w-fit">
                <ArrowLeft className="mr-2 w-4 h-4" /> Wróć do Planu
              </button>

              <div className="bg-white rounded-3xl shadow-xl overflow-hidden mb-6 border border-slate-100">
                <div className={`p-6 sm:p-8 relative ${theme} ${isGame ? '' : 'text-white'}`}>
                  <div className="flex justify-between items-start gap-4 relative z-10">
                    <div>
                      <p className="text-[10px] sm:text-xs font-bold uppercase tracking-widest opacity-80 mb-2 flex items-center gap-1.5 font-sans">
                        <CalendarDays size={14} /> Dzień {props.dayNumber} • {data.location}
                      </p>
                      <h2 className="text-2xl sm:text-3xl font-serif font-bold leading-tight drop-shadow-sm">{data.title}</h2>
                    </div>
                    <Icon className="w-10 h-10 sm:w-12 sm:h-12 opacity-80 shrink-0" />
                  </div>
                </div>

                <div className="p-5 sm:p-8 bg-[#F4F9FF]">
                  {data.type === 'daily' && <StandardDayContent {...props} />}
                  {data.type === 'weekend' && <WeekendDayContent {...props} />}
                  {data.type === 'minigame_match' && <MinigameMatchContent {...props} />}
                  {data.type === 'minigame_scramble' && <MinigameScrambleContent {...props} />}
                  {data.type === 'simulation' && <SimulationContent {...props} />}
                  {data.type === 'video' && <VideoDayContent {...props} />}
                </div>
              </div>
            </div>
          );
        }

        function StandardDayContent({ data, isChallengeCompleted, onToggleChallenge, isDayCompleted, onComplete }) {
          const [quizFinished, setQuizFinished] = useState(false);
          const canComplete = isDayCompleted || quizFinished;

          return (
            <div className="space-y-8">
              <div className="grid md:grid-cols-2 gap-6">
                <div className="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
                  <h3 className="font-serif font-bold text-[#008C45] mb-3 text-lg flex items-center gap-2"><BrainCircuit size={20} /> Ciekawostka dnia</h3>
                  <p className="text-slate-700 text-sm sm:text-base leading-relaxed">{data.trivia}</p>
                </div>
                {data.challenge && (
                  <div className="bg-[#FFF5AD] rounded-2xl p-5 sm:p-6 border border-[#FBC02D] flex flex-col justify-between">
                    <div>
                      <h3 className="font-serif font-bold text-yellow-800 mb-3 text-lg flex items-center gap-2"><Target size={20} /> Wyzwanie</h3>
                      <p className="text-yellow-800 text-sm sm:text-base mb-4">{data.challenge}</p>
                    </div>
                    <button onClick={onToggleChallenge} className={`flex items-center justify-center gap-2 w-full py-3 rounded-xl font-bold transition-all border-2 ${isChallengeCompleted ? 'bg-[#008C45] border-[#008C45] text-white shadow-md' : 'bg-white border-[#FBC02D] text-yellow-800 hover:bg-yellow-50'}`}>
                      {isChallengeCompleted ? <CheckCircle size={20} /> : <div className="w-5 h-5 rounded-full border-2 border-yellow-500" />}
                      {isChallengeCompleted ? 'Zrobione!' : 'Odhacz zadanie'}
                    </button>
                  </div>
                )}
              </div>

              {data.words && (
                <div className="border-t border-slate-200 pt-6">
                  <h3 className="text-xl font-serif font-bold mb-4 flex items-center gap-2 text-[#008C45]"><Volume2 className="text-[#CD212A]" /> Rozmówki</h3>
                  <div className="grid gap-3 sm:grid-cols-2">
                    {data.words.map((word, idx) => <WordCard key={idx} word={word} />)}
                  </div>
                </div>
              )}

              {data.quiz && (
                <div className="border-t border-slate-200 pt-6 bg-white -mx-5 -mb-5 sm:-mx-8 sm:-mb-8 p-5 sm:p-8">
                  <h3 className="text-xl font-serif font-bold mb-4 flex items-center gap-2"><Search className="text-slate-400" size={22}/> Szybki Quiz</h3>
                  <SingleQuiz quizData={data.quiz} onFinish={() => setQuizFinished(true)} />
                  <CompleteButton isDayCompleted={isDayCompleted} canComplete={canComplete} onComplete={onComplete} icon="🍕" lockedText="Rozwiąż quiz najpierw!" />
                </div>
              )}
            </div>
          );
        }

        function WeekendDayContent({ data, isDayCompleted, onComplete }) {
          return (
            <div className="space-y-6">
              <div className="bg-white rounded-2xl p-8 text-center shadow-sm border border-[#55B9DD]">
                <Coffee className="w-16 h-16 mx-auto text-[#55B9DD] mb-4" />
                <h3 className="font-serif font-bold text-blue-900 mb-4 text-2xl">Weekendowy luz</h3>
                <p className="text-slate-700 text-lg leading-relaxed">{data.trivia}</p>
              </div>
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={true} onComplete={onComplete} icon="☕" />
            </div>
          )
        }

        function MinigameMatchContent({ data, isDayCompleted, onComplete }) {
          const [shuffledIt, setShuffledIt] = useState([]);
          const [shuffledPl, setShuffledPl] = useState([]);
          const [selectedIt, setSelectedIt] = useState(null);
          const [selectedPl, setSelectedPl] = useState(null);
          const [matched, setMatched] = useState([]);

          useEffect(() => {
            setShuffledIt([...data.pairs].sort(() => Math.random() - 0.5));
            setShuffledPl([...data.pairs].sort(() => Math.random() - 0.5));
          }, [data.pairs]);

          useEffect(() => {
            if (selectedIt && selectedPl) {
              const isMatch = data.pairs.some(p => p.it === selectedIt && p.pl === selectedPl);
              setTimeout(() => {
                if (isMatch) setMatched(prev => [...prev, selectedIt]);
                setSelectedIt(null); setSelectedPl(null);
              }, 400);
            }
          }, [selectedIt, selectedPl, data.pairs]);

          const gameFinished = matched.length === data.pairs.length;

          return (
            <div className="space-y-6">
              <div className="bg-[#FFF5AD] p-4 rounded-2xl border border-[#FBC02D] text-yellow-900 font-medium">
                {data.trivia}
              </div>
              {!gameFinished ? (
                 <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-2">
                       <h4 className="text-center font-bold text-slate-400 text-xs uppercase mb-2">Po Włosku</h4>
                       {shuffledIt.map(w => {
                         const isMatched = matched.includes(w.it);
                         const isSelected = selectedIt === w.it;
                         let cls = "w-full p-3 rounded-xl border-2 font-bold text-sm sm:text-base text-center transition-all ";
                         if (isMatched) cls += "opacity-0 pointer-events-none"; 
                         else if (isSelected) cls += "bg-[#FBC02D] border-[#FBC02D] text-slate-900 scale-105";
                         else cls += "bg-white border-slate-200 text-slate-700 hover:border-yellow-400 shadow-sm";
                         return <button key={'it'+w.it} onClick={() => setSelectedIt(w.it)} className={cls}>{w.it}</button>
                       })}
                    </div>
                    <div className="space-y-2">
                       <h4 className="text-center font-bold text-slate-400 text-xs uppercase mb-2">Po Polsku</h4>
                       {shuffledPl.map(w => {
                         const isMatched = matched.includes(data.pairs.find(p=>p.pl===w.pl)?.it);
                         const isSelected = selectedPl === w.pl;
                         let cls = "w-full p-3 rounded-xl border-2 font-bold text-sm sm:text-base text-center transition-all ";
                         if (isMatched) cls += "opacity-0 pointer-events-none"; 
                         else if (isSelected) cls += "bg-[#FBC02D] border-[#FBC02D] text-slate-900 scale-105";
                         else cls += "bg-white border-slate-200 text-slate-700 hover:border-yellow-400 shadow-sm";
                         return <button key={'pl'+w.pl} onClick={() => setSelectedPl(w.pl)} className={cls}>{w.pl}</button>
                       })}
                    </div>
                 </div>
              ) : (
                 <div className="bg-[#F4F9FF] p-8 rounded-2xl text-center border-2 border-[#008C45] animate-in zoom-in">
                   <CheckCircle className="w-16 h-16 mx-auto text-[#008C45] mb-4" />
                   <h3 className="text-2xl font-serif font-bold text-[#008C45]">Complimenti!</h3>
                   <p className="text-green-800 mt-2">Świetnie znasz te słówka.</p>
                 </div>
              )}
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || gameFinished} onComplete={onComplete} icon="🏆" lockedText="Połącz wszystkie pary!" />
            </div>
          )
        }

        function MinigameScrambleContent({ data, isDayCompleted, onComplete }) {
          const [bank, setBank] = useState([]);
          const [line, setLine] = useState([]);

          useEffect(() => {
            setBank([...data.words].sort(() => Math.random() - 0.5));
          }, [data.words]);

          const moveWord = (word, fromBank) => {
            if (fromBank) {
              setBank(prev => prev.filter(w => w !== word));
              setLine(prev => [...prev, word]);
            } else {
              setLine(prev => prev.filter(w => w !== word));
              setBank(prev => [...prev, word]);
            }
          }

          const currentSentence = line.join(" ");
          const gameFinished = currentSentence === data.sentence;

          return (
            <div className="space-y-6">
              <div className="bg-[#FFF5AD] p-4 rounded-2xl border border-[#FBC02D] text-yellow-900">
                <p className="font-bold mb-1">Przetłumacz (klikając słowa):</p>
                <p className="text-lg italic">"{data.translation}"</p>
              </div>

              <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-4 min-h-[80px] flex flex-wrap gap-2 content-start">
                {line.map((w, i) => (
                  <button key={'line'+i} onClick={() => moveWord(w, false)} className="bg-[#FBC02D] text-slate-900 font-bold px-4 py-2 rounded-lg shadow-sm active:scale-95 transition-transform">
                    {w}
                  </button>
                ))}
                {line.length === 0 && <span className="text-slate-400 m-auto text-sm">Klikaj klocki poniżej, aby układać zdanie</span>}
              </div>

              <div className="flex flex-wrap gap-2 justify-center py-4">
                 {bank.map((w, i) => (
                  <button key={'bank'+i} onClick={() => moveWord(w, true)} className="bg-white border-2 border-slate-200 text-slate-700 font-bold px-4 py-2 rounded-lg shadow-sm hover:border-yellow-400 active:scale-95 transition-transform">
                    {w}
                  </button>
                ))}
              </div>

              {gameFinished && <div className="text-center text-[#008C45] font-bold text-xl animate-in fade-in">Perfetto! 🎯</div>}
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || gameFinished} onComplete={onComplete} icon="🏆" lockedText="Ułóż poprawne zdanie!" />
            </div>
          )
        }

        function SimulationContent({ data, isDayCompleted, onComplete }) {
          const [history, setHistory] = useState([]);
          const [currentNodeId, setCurrentNodeId] = useState('start');

          useEffect(() => {
            if (history.length === 0) setHistory([{ sender: 'bot', text: data.scenario.start.bot }]);
          }, []);

          const handleChoice = (opt) => {
            setHistory(prev => [...prev, { sender: 'user', text: opt.text }]);
            setTimeout(() => {
               const nextNode = data.scenario[opt.next];
               if (nextNode) {
                  setHistory(prev => [...prev, { sender: 'bot', text: nextNode.bot }]);
                  setCurrentNodeId(opt.next);
               }
            }, 600);
          }

          const currentNode = data.scenario[currentNodeId];
          const isEnd = currentNode?.end;

          return (
            <div className="space-y-6">
               <div className="bg-[#F4F9FF] p-4 rounded-2xl border border-[#55B9DD] text-blue-900 font-medium text-sm">
                {data.trivia}
              </div>

              <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col h-[400px]">
                 <div className="bg-slate-100 p-3 text-center border-b border-slate-200 font-bold text-slate-600 text-sm">
                   Włoch lokalny (Symulator)
                 </div>
                 <div className="flex-1 p-4 overflow-y-auto space-y-4">
                    {history.map((msg, i) => (
                      <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in`}>
                         <div className={`max-w-[80%] p-3 rounded-2xl text-sm ${msg.sender === 'user' ? 'bg-[#008C45] text-white rounded-tr-none' : 'bg-slate-100 text-slate-800 rounded-tl-none border border-slate-200'}`}>
                           {msg.text}
                         </div>
                      </div>
                    ))}
                 </div>
                 {!isEnd && currentNode?.options && (
                    <div className="p-3 bg-slate-50 border-t border-slate-200 flex flex-col gap-2">
                      <span className="text-[10px] uppercase font-bold text-slate-400 text-center mb-1">Wybierz odpowiedź:</span>
                      {currentNode.options.map((opt, i) => (
                        <button key={i} onClick={() => handleChoice(opt)} className="bg-white border-2 border-blue-200 hover:border-[#55B9DD] text-blue-900 font-bold p-3 rounded-xl transition-all active:scale-95 text-left text-sm">
                          {opt.text}
                        </button>
                      ))}
                    </div>
                 )}
              </div>
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || isEnd} onComplete={onComplete} icon="💬" lockedText="Dokończ rozmowę!" />
            </div>
          )
        }

        function VideoDayContent({ data, isDayCompleted, onComplete }) {
          const [quizFinished, setQuizFinished] = useState(false);
          return (
            <div className="space-y-6">
              <div className="bg-red-50 p-4 rounded-2xl border border-red-200 text-red-900 font-medium">
                {data.trivia}
              </div>
              <div className="aspect-video w-full rounded-2xl overflow-hidden shadow-md border-4 border-[#CD212A] bg-black">
                 <iframe 
                   width="100%" height="100%" 
                   src={`https://www.youtube.com/embed/${data.videoId}?rel=0`} 
                   title="YouTube video player" 
                   frameBorder="0"
                   allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                   allowFullScreen
                 ></iframe>
              </div>
              <a href={`https://www.youtube.com/watch?v=${data.videoId}`} target="_blank" rel="noopener noreferrer" className="block text-center text-sm font-bold text-[#CD212A] hover:text-red-800 bg-red-50 py-3 rounded-xl transition-colors">
                 Twórca zablokował wideo? Kliknij tutaj, by obejrzeć je na YouTube! ↗️
              </a>
              <div className="border-t border-slate-200 pt-6">
                 <SingleQuiz quizData={{question: data.question, options: data.options, answer: data.answer}} onFinish={() => setQuizFinished(true)} />
              </div>
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || quizFinished} onComplete={onComplete} icon="🎬" lockedText="Odpowiedz na pytanie!" />
            </div>
          )
        }

        function WordCard({ word }) {
          const speakWord = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(text);
              u.lang = 'it-IT'; u.rate = 0.85; window.speechSynthesis.speak(u);
            }
          };
          return (
            <div className="flex items-center justify-between bg-white p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-[#008C45] shadow-sm transition-all group">
              <div className="pr-3">
                <p className="font-bold text-base sm:text-lg text-slate-800 leading-tight">{word.it}</p>
                <p className="text-slate-500 text-xs sm:text-sm mt-0.5">{word.pl}</p>
              </div>
              <button onClick={() => speakWord(word.it)} className="w-10 h-10 rounded-full bg-[#F4F9FF] text-[#CD212A] flex items-center justify-center group-hover:bg-[#CD212A] group-hover:text-white transition-colors shrink-0">
                <Volume2 className="w-5 h-5" />
              </button>
            </div>
          );
        }

        function SingleQuiz({ quizData, onFinish }) {
          const [selected, setSelected] = useState(null);
          const handleSelect = (idx) => { setSelected(idx); if (onFinish) onFinish(); };
          return (
            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
              <p className="font-bold text-base sm:text-lg mb-5 text-slate-800 font-serif">{quizData.question}</p>
              <div className="space-y-2 sm:space-y-3">
                {quizData.options.map((opt, idx) => {
                  let btnClass = "w-full text-left p-3 sm:p-4 rounded-xl border-2 font-medium transition-all text-sm sm:text-base ";
                  if (selected === null) btnClass += "bg-white border-slate-200 hover:border-[#008C45]";
                  else if (idx === quizData.answer) btnClass += "bg-green-100 border-[#008C45] text-green-900"; 
                  else if (idx === selected) btnClass += "bg-red-100 border-[#CD212A] text-red-900"; 
                  else btnClass += "bg-white border-slate-200 opacity-50"; 
                  return <button key={idx} disabled={selected !== null} onClick={() => handleSelect(idx)} className={btnClass}>{opt}</button>;
                })}
              </div>
            </div>
          );
        }

        function CompleteButton({ isDayCompleted, canComplete, onComplete, icon, lockedText }) {
          return (
            <div className="flex justify-center mt-8">
              <button
                onClick={onComplete}
                disabled={!canComplete}
                className={`flex items-center gap-3 px-8 py-4 rounded-full text-lg font-bold transition-all transform
                  ${isDayCompleted 
                    ? 'bg-slate-200 text-slate-500 shadow-none' 
                    : canComplete
                      ? 'bg-[#008C45] text-white hover:bg-[#006838] shadow-lg hover:scale-105 active:scale-95 cursor-pointer animate-pulse'
                      : 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-80'}`}
              >
                {isDayCompleted ? <><CheckCircle className="w-6 h-6" /> Zaliczone</> : <>
                     {!canComplete && <Lock className="w-5 h-5 mr-1" />}
                     {!canComplete ? (lockedText || 'Zablokowane') : `Zalicz ten dzień! ${icon}`}
                   </>}
              </button>
            </div>
          )
        }

        const getUnlockedData = (profile) => {
          const completed = profile?.completedDays || [];
          const words = []; const trivias = []; const challenges = [];
          completed.sort((a,b) => a - b).forEach(dayNum => {
            const data = appData[dayNum];
            if (data) { 
              const cleanTitle = data.title;
              const formattedTitle = `Dzień ${dayNum}: ${cleanTitle}`;
              
              if (data.words) {
                 data.words.forEach(w => {
                    if (w.it && w.it.trim() !== '') {
                        words.push({ day: dayNum, ...w });
                    }
                 });
              }
              
              if (data.trivia && data.type !== 'minigame_match' && data.type !== 'minigame_scramble' && data.type !== 'simulation') {
                trivias.push({ day: dayNum, text: data.trivia, title: formattedTitle });
              }
              
              if (data.challenge) challenges.push({ day: dayNum, text: data.challenge, title: formattedTitle });
            }
          });
          return { words, trivias, challenges };
        };

        const groupItemsByWeek = (items) => {
          const grouped = {};
          items.forEach(item => { const week = Math.ceil(item.day / 7); if (!grouped[week]) grouped[week] = []; grouped[week].push(item); });
          return grouped;
        };

        function DictionaryView({ profile }) {
          const { words } = getUnlockedData(profile);
          if (words.length === 0) return <EmptyState icon={<BookOpen size={48} />} msg="Zalicz pierwsze dni, aby odkryć słówka!" />;
          const grouped = groupItemsByWeek(words);
          return (
            <div className="animate-in fade-in pb-4">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#008C45]">Rozmówki</h2>
              {Object.keys(grouped).sort().map(wNum => (
                <div key={wNum} className="mb-8 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <h3 className="text-xs font-bold text-white bg-[#008C45] inline-block px-3 py-1 rounded-full uppercase tracking-wider mb-4">{WEEK_THEMES[wNum]}</h3>
                  <div className="grid gap-3 sm:grid-cols-2">{grouped[wNum].map((w, idx) => <WordCard key={idx} word={w} />)}</div>
                </div>
              ))}
            </div>
          );
        }

        function TriviaView({ profile }) {
          const { trivias } = getUnlockedData(profile);
          if (trivias.length === 0) return <EmptyState icon={<BrainCircuit size={48} />} msg="Zalicz pierwsze dni, aby odkryć ciekawostki!" />;
          const grouped = groupItemsByWeek(trivias);
          return (
            <div className="animate-in fade-in pb-4">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#008C45]">Baza Ciekawostek</h2>
              {Object.keys(grouped).sort().map(wNum => (
                <div key={wNum} className="mb-8">
                  <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">{WEEK_THEMES[wNum]}</h3>
                  <div className="space-y-3">
                    {grouped[wNum].map((t, idx) => (
                      <div key={idx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-[#CD212A]">
                        <h4 className="font-serif font-bold text-slate-800 mb-1">{t.title}</h4>
                        <p className="text-slate-600 text-sm leading-relaxed">{t.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function ChallengesView({ profile, onToggle }) {
          const { challenges } = getUnlockedData(profile);
          const completedChalls = profile?.completedChallenges || [];
          if (challenges.length === 0) return <EmptyState icon={<CheckSquare size={48} />} msg="Zalicz pierwsze dni, aby odsłonić listę wyzwań!" />;
          const grouped = groupItemsByWeek(challenges);
          return (
            <div className="animate-in fade-in pb-4">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#008C45]">Twoje Wyzwania</h2>
              {Object.keys(grouped).sort().map(wNum => (
                <div key={wNum} className="mb-8">
                   <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">{WEEK_THEMES[wNum]}</h3>
                   <div className="space-y-3">
                     {grouped[wNum].map((c, idx) => {
                       const isDone = completedChalls.includes(c.day);
                       return (
                         <div key={idx} className={`p-4 rounded-xl border flex gap-4 transition-all ${isDone ? 'bg-[#FFF5AD] border-[#FBC02D]' : 'bg-white border-slate-200'}`}>
                           <button onClick={() => onToggle(c.day)} className={`w-7 h-7 rounded-full shrink-0 flex items-center justify-center border-2 mt-0.5 cursor-pointer hover:scale-110 active:scale-95 transition-all ${isDone ? 'bg-[#008C45] border-[#008C45] text-white shadow-sm' : 'bg-white border-slate-300 hover:border-[#FBC02D] shadow-sm'}`} title={isDone ? "Odznacz wyzwanie" : "Zaznacz wyzwanie jako wykonane"}>
                             {isDone && <CheckCircle size={16} />}
                           </button>
                           <div>
                             <h4 className={`font-serif font-bold text-sm mb-1 ${isDone ? 'text-green-900' : 'text-slate-800'}`}>{c.title}</h4>
                             <p className={`text-sm ${isDone ? 'text-green-800' : 'text-slate-600'}`}>{c.text}</p>
                           </div>
                         </div>
                       );
                     })}
                   </div>
                </div>
              ))}
            </div>
          );
        }

        function EmptyState({ icon, msg }) {
          return (
            <div className="flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm mt-4">
              <div className="mb-4 opacity-50">{icon}</div><p className="font-semibold text-center px-6">{msg}</p>
            </div>
          );
        }

        function TeamView({ allUsers, user, profile }) {
          return (
            <div className="animate-in fade-in pb-4 max-w-2xl mx-auto">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#008C45]">Progres Zespołu</h2>
              <div className="space-y-4">
                {allUsers.map(u => {
                   const isMe = u.id === profile?.id;
                   const completed = u.completedDays?.length || 0;
                   const uBadges = u.badges || [];
                   return (
                     <div key={u.id} className={`bg-white p-5 rounded-2xl shadow-sm border-2 transition-all hover:scale-[1.01] ${isMe ? 'border-[#008C45] bg-green-50/30' : 'border-slate-100'}`}>
                        <div className="flex items-center gap-4 mb-4">
                           <div className={`w-14 h-14 rounded-full flex items-center justify-center text-xl font-bold shrink-0 shadow-inner ${isMe ? 'bg-[#008C45] text-white' : 'bg-slate-200 text-slate-600'}`}>
                             {u.name.substring(0,2).toUpperCase()}
                           </div>
                           <div className="flex-1">
                             <div className="flex justify-between items-end mb-1">
                               <h3 className="font-bold text-lg text-slate-800">{u.name} {isMe && <span className="text-xs text-[#008C45] font-bold ml-1 uppercase tracking-wider">(Ty)</span>}</h3>
                               <span className="text-sm font-bold text-yellow-600">{completed} / 49 dni</span>
                             </div>
                             <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200">
                                <div className="bg-[#008C45] h-full rounded-full transition-all duration-1000" style={{width: `${(completed / 49) * 100}%`}}></div>
                             </div>
                           </div>
                        </div>
                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 min-h-[64px] flex flex-wrap gap-2 items-center">
                           {uBadges.length === 0 ? <span className="text-xs text-slate-400 m-auto italic font-medium">Brak zdobytych odznak</span> : 
                             uBadges.map(bId => (
                               <div key={bId} className="w-10 h-10 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-xl hover:scale-110 transition-transform cursor-help" title={BADGES[bId]?.name}>
                                 {BADGES[bId]?.icon}
                               </div>
                             ))
                           }
                        </div>
                     </div>
                   )
                })}
              </div>
            </div>
          );
        }

        function ChatView({ profile, allUsers, user, today }) {
          const [messages, setMessages] = useState([]);
          const [newMessage, setNewMessage] = useState('');
          const [replyTo, setReplyTo] = useState(null);
          const chatRef = useRef(null);

          const currentWeek = Math.max(1, Math.min(Math.floor(Math.max(0, today.getTime() - new Date('2026-06-08T00:00:00').getTime()) / (1000 * 60 * 60 * 24) / 7) + 1, 7));
          const WEEKLY_QUESTIONS = {
            1: "Czego najbardziej nie możesz się doczekać podczas tego wyjazdu?", 2: "Jaka jest Twoja ulubiona włoska potrawa?", 3: "Wolisz intensywne zwiedzanie, czy relaks z kawą i ładnym widokiem?", 4: "Jakie włoskie produkty spożywcze najbardziej chcesz przetestować na wyjeździe?", 5: "Jaką kulinarną pamiątkę na pewno przywieziesz do Polski?", 6: "Jakie włoskie słówko najbardziej zapadło Ci w pamięć?", 7: "Wielkie odliczanie! O czym zazwyczaj zapominasz przy pakowaniu?"
          };

          // Check and add system message for the week
          useEffect(() => {
              const checkSystemMsg = async () => {
                  const qDocRef = doc(db, 'messages', `weekly_bot_${currentWeek}`);
                  const docSnap = await getDoc(qDocRef);
                  if (!docSnap.exists()) {
                      await setDoc(qDocRef, {
                          text: WEEKLY_QUESTIONS[currentWeek],
                          authorId: 'bot',
                          authorName: `🤖 Pytanie Tygodnia ${currentWeek}`,
                          isSystem: true,
                          week: currentWeek,
                          timestamp: serverTimestamp()
                      });
                  }
              };
              checkSystemMsg();
          }, [currentWeek]);


          useEffect(() => {
            if (!user) return;
            const msgRef = collection(db, 'messages');
            const unsubscribe = onSnapshot(msgRef, (snapshot) => {
              const msgs = []; snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
              msgs.sort((a, b) => (a.timestamp?.toMillis() || Date.now()) - (b.timestamp?.toMillis() || Date.now()));
              setMessages(msgs);
              setTimeout(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, 100);
            });
            return () => unsubscribe();
          }, [user]);

          const toggleReaction = async (msgId, emoji) => {
             const msg = messages.find(m => m.id === msgId);
             if(!msg) return;
             const currentReactions = msg.reactions || {};
             const emojiUsers = currentReactions[emoji] || [];
             const isReacted = emojiUsers.includes(profile.name);
             
             let newEmojiUsers;
             if(isReacted) {
                 newEmojiUsers = emojiUsers.filter(n => n !== profile.name);
             } else {
                 newEmojiUsers = [...emojiUsers, profile.name];
             }
             
             const ref = doc(db, 'messages', msgId);
             await setDoc(ref, {
                 reactions: {
                     ...currentReactions,
                     [emoji]: newEmojiUsers
                 }
             }, { merge: true });
          };


          const sendMessage = async (e) => {
            e.preventDefault();
            if (!newMessage.trim() || !user || !profile) return;
            const msgRef = collection(db, 'messages');
            await addDoc(msgRef, { 
                text: newMessage.trim(), 
                authorId: profile.id, 
                authorName: profile.name, 
                timestamp: serverTimestamp(),
                replyTo: replyTo ? { id: replyTo.id, authorName: replyTo.authorName, text: replyTo.text } : null 
            });
            setNewMessage('');
            setReplyTo(null);
          };

          return (
            <div className="animate-in fade-in flex flex-col h-[calc(100vh-220px)] max-w-2xl mx-auto">
              <h2 className="text-2xl font-serif font-bold mb-4 text-[#008C45]">Czat Zespołu</h2>
              
              <div className="flex-1 bg-white border border-slate-200 rounded-2xl flex flex-col overflow-hidden shadow-sm relative">
                
                <div ref={chatRef} className="flex-1 overflow-y-auto p-4 space-y-6 bg-[#F4F9FF]">
                  {messages.length === 0 ? <div className="text-center text-slate-400 mt-10 text-sm bg-white p-4 rounded-xl border border-slate-100 inline-block mx-auto">Napisz jako pierwszy!</div> : 
                    messages.map((msg, i) => {
                        const isMe = msg.authorId === profile?.id;
                        const isSys = msg.isSystem;

                        return (
                            <div key={msg.id || i} className={`flex flex-col ${isSys ? 'items-center my-6' : (isMe ? 'items-end' : 'items-start')}`}>
                                {!isSys && <span className="text-[10px] text-slate-400 font-bold mb-1 px-1">{isMe ? 'Ty' : msg.authorName}</span>}
                                
                                <div className={`px-4 py-3 rounded-2xl max-w-[85%] shadow-sm text-sm relative ${
                                    isSys ? 'bg-[#FFF5AD] border-2 border-[#FBC02D] text-slate-800 w-full sm:w-[90%] text-center' :
                                    (isMe ? 'bg-[#008C45] text-white rounded-tr-none' : 'bg-white border border-[#55B9DD]/30 text-slate-800 rounded-tl-none')
                                }`}>
                                    
                                    {/* Reply Thread UI */}
                                    {msg.replyTo && (
                                        <div className={`text-[10px] mb-2 pl-2 border-l-2 py-0.5 ${isMe ? 'border-white/50 text-white/80' : 'border-[#55B9DD]/50 text-slate-500'}`}>
                                            <strong className="block truncate">{msg.replyTo.authorName}</strong>
                                            <span className="truncate block opacity-90">{msg.replyTo.text}</span>
                                        </div>
                                    )}

                                    <span className={isSys ? "font-serif font-bold text-base" : ""}>{msg.text}</span>
                                </div>
                                
                                {/* Reactions Bar */}
                                {!isSys && (
                                    <div className={`flex gap-1.5 mt-1.5 items-center ${isMe ? 'flex-row-reverse' : ''}`}>
                                        {['❤️', '👍', '🍕'].map(emoji => {
                                            const count = msg.reactions?.[emoji]?.length || 0;
                                            const active = msg.reactions?.[emoji]?.includes(profile.name);
                                            return (
                                                <button 
                                                    key={emoji}
                                                    onClick={() => toggleReaction(msg.id, emoji)}
                                                    className={`text-[10px] px-2 py-0.5 rounded-full border transition-all flex items-center gap-1 ${
                                                        active ? 'bg-[#008C45]/10 border-[#008C45] opacity-100' : 'bg-transparent border-transparent opacity-50 hover:opacity-100 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {emoji} {count > 0 && <span className={active ? 'text-[#008C45] font-bold' : 'text-slate-500'}>{count}</span>}
                                                </button>
                                            );
                                        })}
                                        <button onClick={() => setReplyTo(msg)} className="text-[10px] text-slate-400 mx-2 hover:text-[#CD212A] uppercase font-bold transition-colors">Odpowiedz</button>
                                    </div>
                                )}
                                {isSys && (
                                    <button onClick={() => setReplyTo(msg)} className="text-[10px] text-slate-500 mt-2 bg-white px-3 py-1 rounded-full border border-slate-200 hover:border-[#008C45] hover:text-[#008C45] uppercase font-bold transition-colors shadow-sm">
                                        Odpowiedz na to pytanie
                                    </button>
                                )}
                            </div>
                        );
                    })
                  }
                </div>

                <div className="p-3 bg-white border-t border-slate-200 flex flex-col z-10">
                  {replyTo && (
                      <div className="bg-[#F4F9FF] px-3 py-2 rounded-t-xl border-l-4 border-[#55B9DD] flex justify-between items-center text-xs mb-2">
                          <div className="truncate text-slate-500">
                              Odpowiadasz: <span className="font-bold text-slate-700">{replyTo.authorName}</span>
                              <span className="block truncate opacity-80">{replyTo.text}</span>
                          </div>
                          <button onClick={() => setReplyTo(null)} className="text-slate-400 hover:text-[#CD212A] ml-2 p-1 transition-colors">
                              <X size={14} />
                          </button>
                      </div>
                  )}
                  <form onSubmit={sendMessage} className="flex gap-2 relative">
                    <input 
                        type="text" 
                        value={newMessage}
                        onChange={e => setNewMessage(e.target.value)} 
                        placeholder="Napisz wiadomość..." 
                        className="flex-1 bg-slate-50 border border-slate-200 rounded-full px-4 py-2 pr-12 text-sm focus:outline-none focus:border-[#CD212A]" 
                    />
                    <button type="submit" disabled={!newMessage.trim()} className="bg-[#CD212A] text-white rounded-full w-10 h-10 flex items-center justify-center font-bold text-sm disabled:opacity-50 hover:bg-red-700 shrink-0 absolute right-1 top-1/2 -translate-y-1/2">
                       <Send size={16} className="-ml-0.5" />
                    </button>
                  </form>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
