        };

        const generateAllDays = (startDateStr, daysCount) => {
          const dates = [];
          let currentDate = new Date(startDateStr);
          while (dates.length < daysCount) {
            dates.push(new Date(currentDate));
            currentDate.setDate(currentDate.getDate() + 1);
          }
          return dates;
        };

        const startDateStr = '2026-06-08T00:00:00';
        const allDaysObj = generateAllDays(startDateStr, 49);

        const formatDate = (date) => date.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });

          const [newBadgeAlert, setNewBadgeAlert] = useState(null);

          useEffect(() => {
            const initAuth = async () => {
              try { await signInAnonymously(auth); } 
              catch (err) { console.error("Auth error:", err); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (u) => { setUser(u); setAuthChecking(false); });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;
            const usersRef = collection(db, 'artifacts', appId, 'public', 'users');
            const unsubscribeUsers = onSnapshot(usersRef, (snapshot) => {
              const usersData = [];
              snapshot.forEach(doc => usersData.push({ id: doc.id, ...doc.data() }));
              setAllUsers(usersData);
              setProfile(usersData.find(u => u.id === user.uid) || null);
            });
            
            const msgsRef = collection(db, 'artifacts', appId, 'public', 'messages');
            const unsubMsgs = onSnapshot(msgsRef, (snap) => {
               let myMsgs = 0;
               snap.forEach(doc => { if (doc.data().authorId === user.uid) myMsgs++; });
               setMessagesCount(myMsgs);
            });

            return () => { unsubscribeUsers(); unsubMsgs(); }
          }, [user]);

          useEffect(() => {
            if (!profile) return;
            const evaluateBadges = () => {
               const earned = profile.badges || [];
               const newlyEarned = [];
               const completed = profile.completedDays?.length || 0;
               const challenges = profile.completedChallenges?.length || 0;
               
               let unlockedWordsCount = 0;
               (profile.completedDays || []).forEach(d => {
                  if (appData[d] && appData[d].words) unlockedWordsCount += appData[d].words.length;
               });

               const checkAndAward = (badgeId, condition) => {
                 if (condition && !earned.includes(badgeId) && !newlyEarned.includes(badgeId)) {
                   newlyEarned.push(badgeId);
                 }
               };

               checkAndAward('primo', completed >= 1);
               checkAndAward('studente', completed >= 10);
               checkAndAward('mezzo', completed >= 25);
               checkAndAward('esploratore', completed >= 40);
               checkAndAward('pronto', completed >= 49);
               checkAndAward('chiacchierone', messagesCount >= 5);
               checkAndAward('sfida', challenges >= 10);
               checkAndAward('maestro', unlockedWordsCount >= 20);

               if (newlyEarned.length > 0) {
                 const userRef = doc(db, 'artifacts', appId, 'public', 'users', user.uid);
                 setDoc(userRef, { badges: [...earned, ...newlyEarned] }, { merge: true });
                 setNewBadgeAlert(BADGES[newlyEarned[0]]);
               }
            };
            evaluateBadges();

            await setDoc(userRef, { completedDays: [...(profile.completedDays || []), dayNum] }, { merge: true });
            setSelectedDay(null);
          };

                  </div>

                    dayNumber={selectedDay} dateObj={allDaysObj[selectedDay - 1]} data={appData[selectedDay]}

                    isDayCompleted={profile?.completedDays?.includes(selectedDay)}
                    isChallengeCompleted={profile?.completedChallenges?.includes(selectedDay)} onToggleChallenge={() => toggleChallenge(selectedDay)}

                    {currentTab === 'team' && <TeamView allUsers={allUsers} user={user} />}
                    {currentTab === 'chat' && <ChatView profile={profile} allUsers={allUsers} user={user} today={today} />}
                  </>

        function LoginScreen({ onSubmit }) {
          const [name, setName] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            const inputName = name.trim();
            if (inputName.length < 2) { setError('Wpisz swoje imię!'); return; }
            const matchedName = Object.keys(USERS_CREDENTIALS).find(key => key.toLowerCase() === inputName.toLowerCase());
            if (!matchedName) { setError('Nie znaleziono takiego imienia na liście wyjazdowej.'); return; }
            if (USERS_CREDENTIALS[matchedName] !== password) { setError('Niepoprawne hasło.'); return; }
            onSubmit(matchedName);
          };

          return (
            <div className="min-h-screen flex items-center justify-center bg-[#FDF9F1] p-4 relative overflow-hidden">

        function DayDispatcher(props) {

        function VideoDayContent({ data, isDayCompleted, onComplete }) {

          )
        }

        function MinigameMatchContent({ data, isDayCompleted, onComplete }) {
          const [shuffledIt, setShuffledIt] = useState([]);
          const [shuffledPl, setShuffledPl] = useState([]);
          const [selectedIt, setSelectedIt] = useState(null);
          const [selectedPl, setSelectedPl] = useState(null);
          const [matched, setMatched] = useState([]);

          useEffect(() => {
            setShuffledIt([...data.pairs].sort(() => Math.random() - 0.5));
            setShuffledPl([...data.pairs].sort(() => Math.random() - 0.5));
          }, [data.pairs]);

          useEffect(() => {
            if (selectedIt && selectedPl) {
              const isMatch = data.pairs.some(p => p.it === selectedIt && p.pl === selectedPl);
              setTimeout(() => {
                if (isMatch) setMatched(prev => [...prev, selectedIt]);
                setSelectedIt(null); setSelectedPl(null);
              }, 400);
            }
          }, [selectedIt, selectedPl, data.pairs]);

          const gameFinished = matched.length === data.pairs.length;
          return (
            <div className="space-y-6">
              <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-amber-900 font-medium">{data.trivia}</div>
              {!gameFinished ? (
                 <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-2">
                       <h4 className="text-center font-bold text-slate-400 text-xs uppercase mb-2">Po Włosku</h4>
                       {shuffledIt.map(w => {
                         const isMatched = matched.includes(w.it); const isSelected = selectedIt === w.it;
                         let cls = "w-full p-3 rounded-xl border-2 font-bold text-sm sm:text-base text-center transition-all ";
                         if (isMatched) cls += "opacity-0 pointer-events-none"; else if (isSelected) cls += "bg-amber-400 border-amber-500 text-slate-900 scale-105"; else cls += "bg-white border-slate-200 text-slate-700 hover:border-amber-300 shadow-sm";
                         return <button key={'it'+w.it} onClick={() => setSelectedIt(w.it)} className={cls}>{w.it}</button>
                       })}
                    </div>
                    <div className="space-y-2">
                       <h4 className="text-center font-bold text-slate-400 text-xs uppercase mb-2">Po Polsku</h4>
                       {shuffledPl.map(w => {
                         const isMatched = matched.includes(w.it); const isSelected = selectedPl === w.pl;
                         let cls = "w-full p-3 rounded-xl border-2 font-bold text-sm sm:text-base text-center transition-all ";
                         if (isMatched) cls += "opacity-0 pointer-events-none"; else if (isSelected) cls += "bg-amber-400 border-amber-500 text-slate-900 scale-105"; else cls += "bg-white border-slate-200 text-slate-700 hover:border-amber-300 shadow-sm";
                         return <button key={'pl'+w.pl} onClick={() => setSelectedPl(w.pl)} className={cls}>{w.pl}</button>
                       })}
                    </div>
                 </div>
              ) : (
                 <div className="bg-green-50 p-8 rounded-2xl text-center border-2 border-[#008C45]">
                   <CheckCircle className="w-16 h-16 mx-auto text-[#008C45] mb-4" />
                   <h3 className="text-2xl font-serif font-bold text-[#006838]">Complimenti!</h3>
                 </div>
              )}
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || gameFinished} onComplete={onComplete} icon="🏆" lockedText="Połącz wszystkie pary!" />
            </div>
          )
        }

        function MinigameScrambleContent({ data, isDayCompleted, onComplete }) {
          const [bank, setBank] = useState([]);
          const [line, setLine] = useState([]);
          useEffect(() => { setBank([...data.words].sort(() => Math.random() - 0.5)); }, [data.words]);
          const moveWord = (word, fromBank) => {
            if (fromBank) { setBank(prev => prev.filter(w => w !== word)); setLine(prev => [...prev, word]); } 
            else { setLine(prev => prev.filter(w => w !== word)); setBank(prev => [...prev, word]); }
          }
          const gameFinished = line.join(" ") === data.sentence;
          return (
            <div className="space-y-6">
              <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-amber-900">
                <p className="font-bold mb-1">Przetłumacz:</p><p className="text-lg italic">"{data.translation}"</p>
              </div>
              <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 min-h-[80px] flex flex-wrap gap-2 content-start">
                {line.map((w, i) => <button key={'line'+i} onClick={() => moveWord(w, false)} className="bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-lg shadow-sm active:scale-95 transition-transform">{w}</button>)}
                {line.length === 0 && <span className="text-slate-400 m-auto text-sm">Klikaj klocki poniżej</span>}
              </div>
              <div className="flex flex-wrap gap-2 justify-center py-4">
                 {bank.map((w, i) => <button key={'bank'+i} onClick={() => moveWord(w, true)} className="bg-white border-2 border-slate-200 text-slate-700 font-bold px-4 py-2 rounded-lg shadow-sm hover:border-amber-400 active:scale-95 transition-transform">{w}</button>)}
              </div>
              {gameFinished && <div className="text-center text-[#008C45] font-bold text-xl animate-in fade-in">Perfetto! 🎯</div>}
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || gameFinished} onComplete={onComplete} icon="🏆" lockedText="Ułóż poprawne zdanie!" />
            </div>
          )
        }

        function SimulationContent({ data, isDayCompleted, onComplete }) {
          const [history, setHistory] = useState([]);
          const [currentNodeId, setCurrentNodeId] = useState('start');
          useEffect(() => { if (history.length === 0) { setHistory([{ sender: 'bot', text: data.scenario.start.bot }]); } }, []);
          const handleChoice = (opt) => {
            setHistory(prev => [...prev, { sender: 'user', text: opt.text }]);
            setTimeout(() => {
               const nextNode = data.scenario[opt.next];
               if (nextNode) { setHistory(prev => [...prev, { sender: 'bot', text: nextNode.bot }]); setCurrentNodeId(opt.next); }
            }, 600);
          }
          const isEnd = data.scenario[currentNodeId]?.end;
          return (
            <div className="space-y-6">
               <div className="bg-blue-50 p-4 rounded-2xl border border-blue-200 text-blue-900 font-medium text-sm">{data.trivia}</div>
              <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col h-[400px]">
                 <div className="bg-slate-100 p-3 text-center border-b border-slate-200 font-bold text-slate-600 text-sm">Włoch lokalny (Symulator)</div>
                 <div className="flex-1 p-4 overflow-y-auto space-y-4">
                    {history.map((msg, i) => (
                      <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                         <div className={`max-w-[80%] p-3 rounded-2xl text-sm ${msg.sender === 'user' ? 'bg-[#008C45] text-white rounded-tr-none' : 'bg-slate-100 text-slate-800 rounded-tl-none border border-slate-200'}`}>{msg.text}</div>
                      </div>
                    ))}
                 </div>
                 {!isEnd && data.scenario[currentNodeId]?.options && (
                    <div className="p-3 bg-slate-50 border-t border-slate-200 flex flex-col gap-2">
                      <span className="text-[10px] uppercase font-bold text-slate-400 text-center mb-1">Wybierz odpowiedź:</span>
                      {data.scenario[currentNodeId].options.map((opt, i) => (
                        <button key={i} onClick={() => handleChoice(opt)} className="bg-white border-2 border-blue-200 hover:border-blue-400 text-blue-900 font-bold p-3 rounded-xl transition-all active:scale-95 text-left text-sm">{opt.text}</button>
                      ))}
                    </div>
                 )}
              </div>
              <CompleteButton isDayCompleted={isDayCompleted} canComplete={isDayCompleted || isEnd} onComplete={onComplete} icon="💬" lockedText="Dokończ rozmowę!" />
            </div>
          )
        }

        function WordCard({ word }) {
          const speakWord = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(text); u.lang = 'it-IT'; u.rate = 0.85; window.speechSynthesis.speak(u);
            }
          };
          return (
            <div className="flex items-center justify-between bg-white p-3 sm:p-4 rounded-xl border border-slate-200 hover:border-[#008C45] shadow-sm transition-all group">
              <div className="pr-3">
                <p className="font-bold text-base sm:text-lg text-slate-800 leading-tight">{word.it}</p>
                <p className="text-slate-500 text-xs sm:text-sm mt-0.5">{word.pl}</p>
              </div>
              <button onClick={() => speakWord(word.it)} className="w-10 h-10 rounded-full bg-[#FDF9F1] text-[#CD212A] flex items-center justify-center group-hover:bg-[#CD212A] group-hover:text-white transition-colors shrink-0"><Volume2 className="w-5 h-5" /></button>
            </div>
          );
        }

        function SingleQuiz({ quizData, onFinish }) {
          const [selected, setSelected] = useState(null);
          const handleSelect = (idx) => { setSelected(idx); if (onFinish) onFinish(); };
          return (
            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
              <p className="font-bold text-base sm:text-lg mb-5 text-slate-800 font-serif">{quizData.question}</p>
              <div className="space-y-2 sm:space-y-3">
                {quizData.options.map((opt, idx) => {
                  let btnClass = "w-full text-left p-3 sm:p-4 rounded-xl border-2 font-medium transition-all text-sm sm:text-base ";
                  if (selected === null) btnClass += "bg-white border-slate-200 hover:border-[#008C45]";
                  else if (idx === quizData.answer) btnClass += "bg-green-100 border-[#008C45] text-green-900"; 
                  else if (idx === selected) btnClass += "bg-red-100 border-[#CD212A] text-red-900"; 
                  else btnClass += "bg-white border-slate-200 opacity-50"; 
                  return <button key={idx} disabled={selected !== null} onClick={() => handleSelect(idx)} className={btnClass}>{opt}</button>;
                })}
              </div>
            </div>
          );
        }

        function CompleteButton({ isDayCompleted, canComplete, onComplete, icon, lockedText }) {
          return (
            <div className="flex justify-center mt-8">
              <button onClick={onComplete} disabled={!canComplete} className={`flex items-center gap-3 px-8 py-4 rounded-full text-lg font-bold transition-all transform ${isDayCompleted ? 'bg-slate-200 text-slate-500 shadow-none' : canComplete ? 'bg-[#008C45] text-white hover:bg-[#006838] shadow-lg shadow-green-700/30 hover:scale-105 active:scale-95 cursor-pointer animate-pulse' : 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-80'}`}>
                {isDayCompleted ? <><CheckCircle className="w-6 h-6" /> Zaliczone</> : <>{!canComplete && <Lock className="w-5 h-5 mr-1" />}{!canComplete ? (lockedText || 'Zablokowane') : `Zalicz ten dzień! ${icon}`}</>}
              </button>
            </div>
          )
        }

        const getUnlockedData = (profile) => {
          const completed = profile?.completedDays || [];
          const words = []; const trivias = []; const challenges = [];
          completed.sort((a,b) => a - b).forEach(dayNum => {
            const data = appData[dayNum];
            if (data) { 
              const cleanTitle = data.title.replace(/^Giorno \d+: /, ''); const formattedTitle = `Dzień ${dayNum}: ${cleanTitle}`;
              if (data.words) data.words.forEach(w => words.push({ day: dayNum, ...w }));
              if (data.trivia) trivias.push({ day: dayNum, text: data.trivia, title: formattedTitle });
              if (data.challenge) challenges.push({ day: dayNum, text: data.challenge, title: formattedTitle });
            }
          });
          return { words, trivias, challenges };
        };
        const groupItemsByWeek = (items) => {
          const grouped = {};
          items.forEach(item => { const week = Math.ceil(item.day / 7); if (!grouped[week]) grouped[week] = []; grouped[week].push(item); });
          return grouped;
        };

        function DictionaryView({ profile }) {
          const { words } = getUnlockedData(profile);
          if (words.length === 0) return <EmptyState icon={<BookOpen size={48} />} msg="Zalicz pierwsze dni, aby odkryć słówka!" />;
          const grouped = groupItemsByWeek(words);
          return (
            <div className="animate-in fade-in pb-4">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#006838]">Rozmówki</h2>
              {Object.keys(grouped).sort().map(wNum => (
                <div key={wNum} className="mb-8 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <h3 className="text-xs font-bold text-white bg-[#006838] inline-block px-3 py-1 rounded-full uppercase tracking-wider mb-4">{WEEK_THEMES[wNum]}</h3>
                  <div className="grid gap-3 sm:grid-cols-2">{grouped[wNum].map((w, idx) => <WordCard key={idx} word={w} />)}</div>
                </div>
              ))}
            </div>
          );
        }

        function TriviaView({ profile }) {
          const { trivias } = getUnlockedData(profile);
          if (trivias.length === 0) return <EmptyState icon={<BrainCircuit size={48} />} msg="Zalicz pierwsze dni, aby odkryć ciekawostki!" />;
          const grouped = groupItemsByWeek(trivias);
          return (
            <div className="animate-in fade-in pb-4">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#006838]">Baza Ciekawostek</h2>
              {Object.keys(grouped).sort().map(wNum => (
                <div key={wNum} className="mb-8">
                  <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">{WEEK_THEMES[wNum]}</h3>
                  <div className="space-y-3">
                    {grouped[wNum].map((t, idx) => (
                      <div key={idx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-[#CD212A]">
                        <h4 className="font-serif font-bold text-slate-800 mb-1">{t.title}</h4>
                        <p className="text-slate-600 text-sm leading-relaxed">{t.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function ChallengesView({ profile, onToggle }) {
          const { challenges } = getUnlockedData(profile);
          const completedChalls = profile?.completedChallenges || [];
          if (challenges.length === 0) return <EmptyState icon={<CheckSquare size={48} />} msg="Zalicz pierwsze dni, aby odsłonić listę wyzwań!" />;
          const grouped = groupItemsByWeek(challenges);
          return (
            <div className="animate-in fade-in pb-4">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#006838]">Twoje Wyzwania</h2>
              {Object.keys(grouped).sort().map(wNum => (
                <div key={wNum} className="mb-8">
                   <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">{WEEK_THEMES[wNum]}</h3>
                   <div className="space-y-3">
                     {grouped[wNum].map((c, idx) => {
                       const isDone = completedChalls.includes(c.day);
                       return (
                         <div key={idx} className={`p-4 rounded-xl border flex gap-4 transition-all cursor-pointer ${isDone ? 'bg-orange-50 border-orange-200' : 'bg-white border-slate-200 hover:border-orange-300 group'}`} onClick={() => onToggle(c.day)}>
                           <button className={`w-7 h-7 rounded-full shrink-0 flex items-center justify-center border-2 mt-0.5 transition-all ${isDone ? 'bg-orange-500 border-orange-500 text-white shadow-sm' : 'bg-white border-slate-300 group-hover:border-orange-400 group-hover:bg-orange-50 shadow-sm'}`}>
                             {isDone && <CheckCircle size={16} />}
                           </button>
                           <div>
                             <h4 className={`font-serif font-bold text-sm mb-1 ${isDone ? 'text-orange-900' : 'text-slate-800'}`}>{c.title}</h4>
                             <p className={`text-sm ${isDone ? 'text-orange-800' : 'text-slate-600'}`}>{c.text}</p>
                           </div>
                         </div>
                       );
                     })}
                   </div>
                </div>
              ))}
            </div>
          );
        }

        function TeamView({ allUsers, user }) {
          return (
            <div className="animate-in fade-in pb-4 max-w-2xl mx-auto">
              <h2 className="text-2xl font-serif font-bold mb-6 text-[#006838]">Progres Zespołu</h2>
              <div className="space-y-4">
                {allUsers.map(u => {
                   const isMe = u.id === user.uid;
                   const completed = u.completedDays?.length || 0;
                   const uBadges = u.badges || [];
                   return (
                     <div key={u.id} className={`bg-white p-5 rounded-2xl shadow-sm border-2 transition-all hover:scale-[1.01] ${isMe ? 'border-[#008C45] bg-green-50/30' : 'border-slate-100'}`}>
                        <div className="flex items-center gap-4 mb-4">
                           <div className={`w-14 h-14 rounded-full flex items-center justify-center text-xl font-bold shrink-0 shadow-inner ${isMe ? 'bg-[#008C45] text-white' : 'bg-slate-200 text-slate-600'}`}>{u.name.substring(0,2).toUpperCase()}</div>
                           <div className="flex-1">
                             <div className="flex justify-between items-end mb-1">
                               <h3 className="font-bold text-lg text-slate-800">{u.name} {isMe && <span className="text-xs text-[#008C45] font-bold ml-1 uppercase tracking-wider">(Ty)</span>}</h3>
                               <span className="text-sm font-bold text-amber-600">{completed} / 49 dni</span>
                             </div>
                             <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200">
                                <div className="bg-gradient-to-r from-amber-400 to-orange-500 h-full rounded-full transition-all duration-1000" style={{width: `${(completed / 49) * 100}%`}}></div>
                             </div>
                           </div>
                        </div>
                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 min-h-[64px] flex flex-wrap gap-2 items-center">
                           {uBadges.length === 0 ? <span className="text-xs text-slate-400 m-auto italic font-medium">Brak zdobytych odznak</span> : 
                             uBadges.map(bId => <div key={bId} className="w-10 h-10 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-xl hover:scale-110 transition-transform cursor-help" title={BADGES[bId]?.name}>{BADGES[bId]?.icon}</div>)
                           }
                        </div>
                     </div>
                   )
                })}
              </div>
            </div>
          );
        }

        function ChatView({ profile, allUsers, user, today }) {
          const [messages, setMessages] = useState([]);
          const [newMessage, setNewMessage] = useState('');
          const chatRef = useRef(null);

          const currentWeek = Math.max(1, Math.min(Math.floor(Math.max(0, today.getTime() - new Date('2026-06-08T00:00:00').getTime()) / (1000 * 60 * 60 * 24) / 7) + 1, 7));
          const WEEKLY_QUESTIONS = { 1: "Czego najbardziej nie możesz się doczekać podczas tego wyjazdu?", 2: "Jaka jest Twoja ulubiona włoska potrawa?", 3: "Wolisz intensywne zwiedzanie, czy relaks z kawą i ładnym widokiem?", 4: "Jakie włoskie produkty spożywcze najbardziej chcesz przetestować na wyjeździe?", 5: "Jaką kulinarną pamiątkę na pewno przywieziesz do Polski?", 6: "Jakie włoskie słówko najbardziej zapadło Ci w pamięć?", 7: "O czym zazwyczaj zapominasz przy pakowaniu?" };

          useEffect(() => {
            if (!user) return;
            const msgRef = collection(db, 'artifacts', appId, 'public', 'messages');
            const unsubscribe = onSnapshot(msgRef, (snapshot) => {
              const msgs = []; snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
              msgs.sort((a, b) => (a.timestamp?.toMillis() || Date.now()) - (b.timestamp?.toMillis() || Date.now()));
              setMessages(msgs); setTimeout(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, 100);
            });
            return () => unsubscribe();
          }, [user]);

          const sendMessage = async (e) => {
            e.preventDefault(); if (!newMessage.trim() || !user || !profile) return;
            const msgRef = collection(db, 'artifacts', appId, 'public', 'messages');
            await addDoc(msgRef, { text: newMessage.trim(), authorId: user.uid, authorName: profile.name, timestamp: serverTimestamp() });
            setNewMessage('');
          };

          return (
            <div className="animate-in fade-in flex flex-col h-[calc(100vh-160px)] sm:h-auto max-w-2xl mx-auto">
              <h2 className="text-2xl font-serif font-bold mb-4 text-[#006838]">Czat Zespołu</h2>
              <div className="flex-1 bg-white border border-slate-200 rounded-2xl flex flex-col overflow-hidden min-h-[350px] shadow-sm">
                <div className="bg-amber-50 p-3 sm:p-4 border-b border-amber-200 flex gap-3 items-start shrink-0">
                  <div className="bg-amber-500 text-white p-2 rounded-full shrink-0 shadow-sm"><MessageCircle size={16} /></div>
                  <div>
                    <span className="text-[10px] font-bold text-amber-600 uppercase tracking-wider font-sans">Pytanie Tygodnia {currentWeek}</span>
                    <p className="text-sm font-bold text-amber-900 mt-0.5 font-serif">{WEEKLY_QUESTIONS[currentWeek]}</p>
                  </div>
                </div>
                <div ref={chatRef} className="flex-1 overflow-y-auto p-4 space-y-4 bg-[#FDF9F1]">
                  {messages.length === 0 ? <div className="text-center text-slate-400 mt-10 text-sm bg-white p-4 rounded-xl border border-slate-100 inline-block mx-auto">Napisz jako pierwszy!</div> : 
                    messages.map(msg => (
                      <div key={msg.id} className={`flex flex-col ${msg.authorId === user.uid ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-slate-400 font-bold mb-1 px-1">{msg.authorId === user.uid ? 'Ty' : msg.authorName}</span>
                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm shadow-sm ${msg.authorId === user.uid ? 'bg-[#008C45] text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none'}`}>{msg.text}</div>
                      </div>
                    ))
                  }
                </div>
                <form onSubmit={sendMessage} className="p-3 bg-white border-t border-slate-200 flex gap-2 shrink-0">
                  <input type="text" value={newMessage} onChange={e => setNewMessage(e.target.value)} placeholder="Napisz wiadomość..." className="flex-1 bg-slate-50 border border-slate-200 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-[#CD212A]" />
                  <button type="submit" disabled={!newMessage.trim()} className="bg-[#CD212A] text-white rounded-full px-5 py-2 font-bold text-sm disabled:opacity-50 hover:bg-red-700">Wyślij</button>
                </form>
              </div>
            </div>
          );
        }

        function EmptyState({ icon, msg }) {
          return <div className="flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm mt-4"><div className="mb-4 opacity-50">{icon}</div><p className="font-semibold text-center px-6">{msg}</p></div>;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
